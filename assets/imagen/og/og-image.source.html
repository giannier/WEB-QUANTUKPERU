<!-- =============================================================
     FUENTE de og-image.png. Editable.

     Es la miniatura que aparece al compartir el enlace en WhatsApp,
     LinkedIn o Facebook. NO se genera con IA a proposito: el logo
     tiene que ser el real y el texto, texto de verdad.

     Para regenerarla despues de editar, desde la raiz del proyecto:

       chrome --headless=new --disable-gpu --hide-scrollbars          --window-size=1200,630          --screenshot=assets/imagen/og/og-image.png          assets/imagen/og/og-image.source.html

     El lienzo es de 1200x630 exactos: si agregas texto, vigila que
     el pie no se salga.
     ============================================================= -->
<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    background: #0e0e10;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 50px 68px 0;
    isolation: isolate;
    overflow: hidden;
  }

  /* Line-art de marca, el mismo lenguaje visual del hero */
  .lines {
    position: absolute;
    inset: -10% -20% auto auto;
    z-index: -1;
    width: 780px;
    height: 780px;
    opacity: 0.3;
  }

  /* Resplandor rojo en la esquina, sutil */
  .glow {
    position: absolute;
    inset: auto -180px -260px auto;
    z-index: -1;
    width: 620px;
    height: 620px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(237, 28, 36, 0.42) 0%, transparent 68%);
  }

  .logo {
    height: 76px;
    width: auto;
    display: block;
  }

  .body { margin-top: 34px; }

  .eyebrow {
    display: inline-block;
    padding: 8px 18px;
    margin-bottom: 22px;
    background: #ed1c24;
    color: #fff;
    font-family: "Poppins", sans-serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.04em;
    border-radius: 5px;
  }

  /* 52px sobre 20ch da exactamente tres líneas. Con 62px salían cuatro y
     el pie de la tarjeta quedaba fuera del lienzo de 630px. */
  h1 {
    font-family: "Poppins", sans-serif;
    font-size: 52px;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -0.025em;
    color: #fff;
    max-width: 20ch;
  }

  p {
    margin-top: 20px;
    font-family: "Open Sans", sans-serif;
    font-size: 23px;
    line-height: 1.45;
    color: rgba(255, 255, 255, 0.72);
    max-width: 36ch;
  }

  /* Barra inferior de marca */
  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 -72px;
    padding: 26px 72px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    font-family: "Poppins", sans-serif;
    font-size: 23px;
    font-weight: 600;
  }

  .domain { color: #fff; }

  .tags {
    display: flex;
    gap: 30px;
    color: rgba(255, 255, 255, 0.6);
    font-weight: 500;
  }

  .tags span { display: flex; align-items: center; gap: 11px; }

  .tags span::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ed1c24;
  }
</style>
</head>
<body>

<div class="card">
  <div class="glow"></div>

  <svg class="lines" viewBox="0 0 900 900" fill="none"
       stroke="rgba(255,255,255,.34)" stroke-width="1" aria-hidden="true">
    <path d="M-40 700C160 640 300 520 420 360S700 60 940 40"/>
    <path d="M-40 760C180 700 330 580 450 420S720 120 940 100"/>
    <path d="M-40 820C200 760 360 640 480 480S740 180 940 160"/>
    <path d="M60 900C240 820 380 700 500 545S760 260 940 245"/>
    <ellipse cx="620" cy="430" rx="330" ry="330" transform="rotate(-24 620 430)"/>
    <ellipse cx="620" cy="430" rx="250" ry="330" transform="rotate(-24 620 430)"/>
    <ellipse cx="620" cy="430" rx="170" ry="330" transform="rotate(-24 620 430)"/>
  </svg>

  <div>
    <img class="logo" src="../LOGO ORIGINAL.png" alt="Quantuk Perú">

    <div class="body">
      <span class="eyebrow">Consultoría corporativa</span>
      <h1>Fortalecemos la estructura y la excelencia operativa</h1>
      <p>Compliance, sistemas de gestión ISO y mejora continua de procesos.</p>
    </div>
  </div>

  <div class="foot">
    <span class="domain">quantukperu.com</span>
    <span class="tags">
      <span>Compliance</span>
      <span>ISO</span>
      <span>Mejora continua</span>
    </span>
  </div>
</div>

</body>
</html>
