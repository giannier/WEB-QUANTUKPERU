<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada | Quantuk Perú</title>
<meta name="description" content="La página que buscas no existe o fue movida.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#ed1c24">
<link rel="icon" href="assets/imagen/LOGO ORIGINAL.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Las tipografías se cargan SIN bloquear el pintado.
     Como <link rel="stylesheet"> normal, el navegador no dibuja nada hasta
     recibirla: si Google responde lento o no responde, la página se queda
     en blanco esperando. Con media="print" el navegador la descarga sin
     considerarla necesaria para pintar, y al terminar se pasa a "all".
     El texto aparece de inmediato con la tipografía del sistema y cambia a
     Poppins cuando llega. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"></noscript>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<main class="error-page">
  <div>
    <img src="assets/imagen/LOGO ORIGINAL.png" alt="Quantuk Perú" width="174" height="58">
    <p class="error-page__code">404</p>
    <h1>Esta página no existe</h1>
    <p>El enlace que seguiste puede estar roto o la página pudo haber sido movida.</p>
    <div style="display:flex;gap:var(--space-sm);justify-content:center;flex-wrap:wrap">
      <a class="btn btn--primary" href="/">Volver al inicio</a>
      <a class="btn btn--ghost" href="/contacto">Contáctanos</a>
    </div>
  </div>
</main>
</body>
</html>
